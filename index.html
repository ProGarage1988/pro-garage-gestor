<style>
:root{--bg:#0b0b0d;--card:#16171a;--line:#2a2b30;--tx:#f4f4f5;--mu:#a1a1aa;--ac:#e11d2e;--ok:#22c55e}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,system-ui,'Segoe UI',sans-serif;padding-top:env(safe-area-inset-top,0px)}
#app{min-height:100%;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:5;background:rgba(11,11,13,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
header b{letter-spacing:.08em}header b i{color:var(--ac);font-style:normal}
main{flex:1;padding:14px 14px calc(30px + env(safe-area-inset-bottom,0px))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.mu{color:var(--mu);font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}.sp{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:11px 14px;font:600 14px/1.2 -apple-system,system-ui,sans-serif;cursor:pointer;text-decoration:none;display:inline-block}
.btn.g{background:transparent;border:1px solid var(--line)}.btn.ok{background:var(--ok);color:#04230f}.btn:disabled{opacity:.4}
input,select{width:100%;background:#0f1012;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit}
label{font-size:13px;color:var(--mu);display:block;margin:10px 0 4px}
.bn{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);background:#111214;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bn button{background:none;border:0;color:var(--mu);padding:12px 4px;font:600 13px/1.2 -apple-system,system-ui,sans-serif;position:relative}.bn button.on{color:var(--tx);box-shadow:inset 0 2px var(--ac)}
.bn i{position:absolute;top:6px;margin-left:4px;background:var(--ac);color:#fff;border-radius:99px;font-style:normal;font-size:11px;padding:0 6px}
.chips{display:flex;gap:8px;margin-bottom:12px}.chip{background:var(--card);border:1px solid var(--line);color:var(--mu);border-radius:99px;padding:8px 14px;font:13px/1.2 -apple-system,system-ui,sans-serif}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.bar{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin:10px 0 4px}.seg{height:10px;border-radius:3px;background:#26272b}.seg.f{background:var(--ac)}
.gift{border:1px dashed var(--ok);border-radius:10px;padding:10px;margin-top:10px;font-size:14px}
.big{font-size:26px;font-weight:700}.demo{background:#2a0b10;border:1px solid var(--ac);border-radius:10px;padding:10px;font-size:13px;margin:12px 0}
.err{color:#ff6b78;font-size:13px;min-height:16px}.login{max-width:420px;margin:auto;padding:40px 20px;width:100%}
</style>
